<div id="q3-list-return">
  <div class="kr-caption">대화목록 복귀 버튼 제안 · 가상 대화와 모의 창</div>
  <div class="kr-scene">
    <section class="kr-window kr-chat" aria-label="현재 대화창">
      <div class="kr-titlebar"><span aria-hidden="true">● ● ●</span><span>카카오톡 · 대화창</span></div>
      <header class="kr-chat-header"><div class="kr-identity"><span class="kr-avatar" aria-hidden="true">나</span><div><span class="kr-small">현재 대화 상대</span><h2 class="kr-current-name">친구 나</h2></div></div><button type="button" class="kr-open cursor-interaction" aria-controls="kr-list-window" aria-expanded="false">대화목록</button></header>
      <div class="kr-messages" aria-live="polite"></div>
      <div class="kr-compose"><label for="kr-draft">메시지 초안</label><textarea id="kr-draft" rows="2" maxlength="1000" placeholder="질문을 작성하세요"></textarea><span class="kr-small">설계 예시 · 실제 메시지 전송 없음</span></div>
    </section>
    <section id="kr-list-window" class="kr-window kr-list-window" aria-label="복원한 대화목록 창" hidden>
      <header class="kr-list-header"><h2>대화목록</h2><button type="button" class="kr-close cursor-interaction">목록 닫기</button></header>
      <div class="kr-list" role="group" aria-label="이동할 대화 선택"></div>
      <div class="kr-list-footer">상대를 선택하면 해당 대화로 이동</div>
    </section>
  </div>
  <div class="kr-legend"><span>닫혀 있어도 같은 버튼으로 복원</span><span>이미 열려 있으면 같은 목록 표시</span></div>
</div>
<style>
#q3-list-return{--kr-surface:light-dark(#fff,#252a2e);--kr-text:light-dark(#22282c,#f3f5f6);--kr-muted:light-dark(#55626c,#c0cbd4);--kr-chrome:light-dark(#f4f6f8,#30383e);--kr-line:light-dark(#c8d2da,#687781);--kr-chat:light-dark(#c9dee9,#294251);--kr-desktop:light-dark(#edf2f5,#19232a);--kr-yellow:light-dark(#ffea58,#71601d);--kr-selected:light-dark(#fff5bd,#5b501e);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:var(--kr-text);width:100%}
#q3-list-return *{box-sizing:border-box}
#q3-list-return [hidden]{display:none!important}
#q3-list-return .kr-caption{font-size:14px;color:var(--kr-muted);margin-bottom:12px}
#q3-list-return .kr-scene{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;align-items:start;background:var(--kr-desktop);padding:20px;border-radius:14px}
#q3-list-return[data-list-open="true"] .kr-scene{grid-template-columns:minmax(0,1.45fr) minmax(0,1fr)}
#q3-list-return .kr-window{background:var(--kr-surface);border:1px solid var(--kr-line);border-radius:12px;overflow:hidden;min-width:0}
#q3-list-return .kr-titlebar{display:flex;align-items:center;gap:22px;background:var(--kr-chrome);border-bottom:1px solid var(--kr-line);padding:12px 16px;font-size:13px}
#q3-list-return .kr-titlebar>span:first-child{color:var(--kr-muted);font-size:10px;letter-spacing:4px}
#q3-list-return h2{font-size:20px;line-height:1.4;font-weight:600;margin:0}
#q3-list-return .kr-chat-header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;padding:22px;background:var(--kr-chat)}
#q3-list-return .kr-identity{display:flex;align-items:center;gap:12px;min-width:0}
#q3-list-return .kr-avatar{width:44px;height:44px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--kr-chrome);border:1px solid var(--kr-line);border-radius:17px;font-size:19px}
#q3-list-return .kr-small{font-size:12px;color:var(--kr-muted)}
#q3-list-return button{font:inherit;color:var(--kr-text)}
#q3-list-return .kr-open{background:var(--kr-surface);border:2px solid var(--kr-text);border-radius:8px;padding:10px 14px;font-weight:600;min-height:44px}
#q3-list-return .kr-messages{background:var(--kr-chat);min-height:232px;padding:18px 22px 32px;display:flex;flex-direction:column;gap:18px}
#q3-list-return .kr-bubble{max-width:92%;align-self:flex-start;padding:12px 15px;background:var(--kr-surface);border-radius:10px;overflow-wrap:anywhere}
#q3-list-return .kr-bubble.me{background:var(--kr-yellow);align-self:flex-end}
#q3-list-return .kr-compose{border-top:1px solid var(--kr-line);padding:16px 20px}
#q3-list-return label{display:block;font-size:13px;margin-bottom:7px}
#q3-list-return textarea{font:inherit;font-size:16px;color:var(--kr-text);width:100%;padding:10px;border:1px solid var(--kr-line);border-radius:7px;background:var(--kr-surface);resize:vertical;min-height:70px}
#q3-list-return .kr-compose>span{display:block;margin-top:8px}
#q3-list-return .kr-list-window{border:2px solid var(--kr-text)}
#q3-list-return .kr-list-header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;padding:18px 16px;background:var(--kr-chrome);border-bottom:1px solid var(--kr-line)}
#q3-list-return .kr-close{font-size:12px;min-height:40px;background:var(--kr-surface);border:1px solid var(--kr-line);border-radius:7px;padding:8px 10px}
#q3-list-return .kr-list{display:grid;gap:8px;padding:14px 10px}
#q3-list-return .kr-person{display:flex;align-items:center;gap:12px;text-align:left;width:100%;min-height:80px;padding:13px 10px;background:var(--kr-surface);border:1px solid transparent;border-radius:8px}
#q3-list-return .kr-person[aria-pressed="true"]{border-color:var(--kr-text);background:var(--kr-selected)}
#q3-list-return .kr-person-copy{display:grid;gap:3px;min-width:0;overflow-wrap:anywhere}
#q3-list-return .kr-person-copy>span:first-child{font-weight:600}
#q3-list-return .kr-person-copy>span:last-child{font-size:12px;color:var(--kr-muted)}
#q3-list-return .kr-list-footer{padding:16px;border-top:1px solid var(--kr-line);font-size:12px;color:var(--kr-muted)}
#q3-list-return .kr-legend{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:12px;font-size:13px;color:var(--kr-muted)}
@media(max-width:680px){#q3-list-return[data-list-open="true"] .kr-scene{grid-template-columns:1fr}#q3-list-return .kr-scene{padding:10px;gap:14px}#q3-list-return .kr-chat-header{padding:16px}#q3-list-return .kr-messages{padding:15px;min-height:190px}#q3-list-return .kr-titlebar{gap:12px;font-size:12px;padding:11px}#q3-list-return .kr-compose{padding:15px}#q3-list-return .kr-list{grid-template-columns:1fr}#q3-list-return .kr-identity{gap:8px}#q3-list-return h2{font-size:18px}}
</style>
<script>
(() => {
 const root=document.getElementById('q3-list-return');
 const people=[
  {id:'a',name:'친구 가',avatar:'가',incoming:'과제에서 어느 부분이 궁금해?',outgoing:'풀이 과정을 같이 확인하고 싶어.'},
  {id:'b',name:'친구 나',avatar:'나',incoming:'자료는 확인했어?',outgoing:'응, 확인했어.'},
  {id:'s',name:'과제 스터디',avatar:'팀',incoming:'질문은 여기에 남겨 줘.',outgoing:'다음에 함께 확인하자.'}
 ];
 const state={selected:'b',listOpen:false,drafts:{}};
 const list=root.querySelector('.kr-list');
 const input=root.querySelector('textarea');
 const opener=root.querySelector('.kr-open');
 function applySaved(saved){
  if(saved?.version!==2)return;
  if(people.some(p=>p.id===saved.selected))state.selected=saved.selected;
  state.listOpen=saved.listOpen===true;
  people.forEach(p=>{if(typeof saved.drafts?.[p.id]==='string')state.drafts[p.id]=saved.drafts[p.id].slice(0,1000);});
 }
 applySaved(window.openai?.widgetState?.privateContent);
 function persist(){if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{design:'conversation-list-entry',selectedConversation:state.selected,listOpen:state.listOpen},privateContent:{version:2,...state}}).catch(()=>{});}
 function render(){
  const p=people.find(p=>p.id===state.selected);
  root.dataset.listOpen=String(state.listOpen);
  root.querySelector('.kr-list-window').hidden=!state.listOpen;
  opener.setAttribute('aria-expanded',String(state.listOpen));
  root.querySelector('.kr-current-name').textContent=p.name;
  root.querySelector('.kr-chat-header .kr-avatar').textContent=p.avatar;
  const messages=root.querySelector('.kr-messages');messages.replaceChildren();
  [p.incoming,p.outgoing].forEach((text,i)=>{const b=document.createElement('div');b.className='kr-bubble'+(i?' me':'');b.textContent=text;messages.append(b);});
  input.value=state.drafts[state.selected]||'';
  list.querySelectorAll('button').forEach(b=>{const active=b.dataset.person===state.selected;b.setAttribute('aria-pressed',String(active));b.querySelector('.kr-person-state').textContent=active?'현재 대화':'이 대화로 이동';});
 }
 people.forEach(p=>{
  const button=document.createElement('button');button.type='button';button.className='kr-person cursor-interaction';button.dataset.person=p.id;
  const avatar=document.createElement('span');avatar.className='kr-avatar';avatar.textContent=p.avatar;avatar.setAttribute('aria-hidden','true');
  const copy=document.createElement('span');copy.className='kr-person-copy';const name=document.createElement('span');name.textContent=p.name;const status=document.createElement('span');status.className='kr-person-state';copy.append(name,status);button.append(avatar,copy);list.append(button);
  button.addEventListener('click',()=>{state.drafts[state.selected]=input.value;state.selected=p.id;state.listOpen=false;render();persist();opener.focus();});
 });
 opener.addEventListener('click',()=>{state.drafts[state.selected]=input.value;state.listOpen=true;render();persist();root.querySelector('.kr-close').focus();});
 root.querySelector('.kr-close').addEventListener('click',()=>{state.listOpen=false;render();persist();opener.focus();});
 input.addEventListener('input',()=>{state.drafts[state.selected]=input.value;persist();});
 window.addEventListener('openai:set_globals',event=>{applySaved(event.detail?.globals?.widgetState?.privateContent);render();});
 render();
})();
</script>
